services:
    - type: web
      name: palacin-booking-api
      env: docker
      dockerfilePath: ./render/Dockerfile
      dockerContext: .
      plan: free
      healthCheckPath: /api
      envVars:
        - key: APP_ENV
          value: prod
        - key: MAILER_DSN
          value: null://null
        - key: DATABASE_URL
          fromDatabase:
            name: palacin-db
            property: connectionString

    - type: private
      name: palacin-db
      env: docker
      image:
        url: postgres:16-alpine
      plan: free
      envVars:
        - key: POSTGRES_USER
          value: palacin
        - key: POSTGRES_PASSWORD
          value: palacin
        - key: POSTGRES_DB
          value: palacin_booking
    # Usamos psql nativo de Render
    # Si tu Render ya tiene tipo psql, cambia pserv por psql