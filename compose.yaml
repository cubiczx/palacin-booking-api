services:
  php:
    build:
      context: .
      target: php
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-efb95af50cbddafdc44137fc7e91e23c}
      DATABASE_URL: mysql://${MYSQL_USER:-palacin}:${MYSQL_PASSWORD:-change_me}@database:3306/${MYSQL_DATABASE:-palacin_booking}?serverVersion=8.0.32&charset=utf8mb4
      MAILER_DSN: ${MAILER_DSN:-null://null}
    depends_on:
      database:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mkdir -p /var/www/app/var/cache /var/www/app/var/log &&
      chown -R www-data:www-data /var/www/app/var &&
      su -s /bin/sh www-data -c 'php bin/console doctrine:migrations:migrate --no-interaction' &&
      php-fpm
      "
    volumes:
      - app_var:/var/www/app/var
    restart: unless-stopped

  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "8080:80"
    depends_on:
      - php
    restart: unless-stopped

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-palacin_booking}
      MYSQL_USER: ${MYSQL_USER:-palacin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
  app_var: